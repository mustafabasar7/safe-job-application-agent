[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-job-application-agent"
version = "0.1.0"
description = "Model-agnostic LangGraph and Playwright CLI agent for official career sites"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "langgraph==1.2.9",
  "langgraph-checkpoint-sqlite==3.1.0",
  "python-dotenv>=1.1,<2",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
dev = [
  "langgraph-cli[inmem]==0.4.31",
  "pytest>=8.3,<9",
  "ruff>=0.12,<1",
  "mypy>=1.16,<2",
]

[project.scripts]
job-agent = "job_application_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["job_application_agent"]
